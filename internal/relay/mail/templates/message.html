<!doctype html>
<html lang="pt-BR">
<body style="font-family:Arial,sans-serif;font-size:15px;line-height:1.5;color:#222">
<div style="max-width:520px;margin:0 auto;padding:24px">
<h1 style="font-size:19px">{{.Subject}}</h1>
<p>{{.Text}}</p>
<p><a href="{{.Link}}" style="display:inline-block;padding:10px 18px;background:#222;color:#fff;border-radius:6px;text-decoration:none">{{.Button}}</a></p>
<p style="font-size:13px;color:#555;word-break:break-all">{{.Link}}</p>
{{with .Note}}<p style="font-size:13px;color:#555">{{.}}</p>{{end}}
</div>
</body>
</html>
